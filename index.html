<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Focus Timer BY JUDY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f0f13; --surface:rgba(255,255,255,0.04); --surface2:rgba(255,255,255,0.07);
  --surface3:rgba(255,255,255,0.12); --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#f0eee8; --text2:#9997a0; --text3:#6b6876;
  --accent:#c8ff57; --accent2:#57ffc8; --accent3:#ff6b6b; --accent4:#ffb347;
  --focus-glow:rgba(200,255,87,0.15); --break-glow:rgba(87,255,200,0.15);
  --blur:blur(20px) saturate(160%);
  --font-mono:'DM Mono',monospace; --font-body:'Pretendard',sans-serif;
  --radius:16px; --radius-sm:10px;
}
.light {
  --bg:#f2f0eb; --surface:rgba(255,255,255,0.55); --surface2:rgba(255,255,255,0.75);
  --surface3:rgba(255,255,255,0.9); --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.12);
  --text:#1a1820; --text2:#5c5869; --text3:#9b98a8;
  --focus-glow:rgba(100,180,0,0.12); --break-glow:rgba(0,160,110,0.12);
}
html,body,#root { width:100%; height:100%; font-family:var(--font-body); background:var(--bg); color:var(--text); transition:background .4s,color .4s; overflow:hidden; }
.shell { width:100%; height:100%; display:flex; flex-direction:column; position:relative; }

/* COMPACT BAR */
.compact-bar { display:flex; align-items:center; gap:10px; padding:0 14px; height:48px; min-height:48px; background:rgba(15,15,19,0.88); backdrop-filter:var(--blur); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; transition:background .4s; }
.light .compact-bar { background:rgba(242,240,235,0.88); }
.compact-timer { font-family:var(--font-mono); font-size:15px; font-weight:500; letter-spacing:1px; color:var(--accent); flex-shrink:0; }
.compact-timer.brk { color:var(--accent2); }
.compact-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1.2px; flex-shrink:0; }
.compact-input-wrap { flex:1; display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:0 10px; height:30px; transition:border-color .2s; }
.compact-input-wrap:focus-within { border-color:var(--border2); }
.compact-input-wrap input { flex:1; background:transparent; border:none; outline:none; font-size:12px; color:var(--text); font-family:var(--font-body); }
.compact-input-wrap input::placeholder { color:var(--text3); }
.icon-btn { background:none; border:none; cursor:pointer; color:var(--text3); padding:4px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:color .2s,background .2s; flex-shrink:0; }
.icon-btn:hover { color:var(--text); background:var(--surface3); }
.icon-btn.warn:hover { color:var(--accent3); }
.icon-btn.hist:hover { color:var(--accent4); }
.theme-btn { font-size:13px; background:none; border:none; cursor:pointer; padding:3px 5px; border-radius:6px; transition:background .2s; flex-shrink:0; }
.theme-btn:hover { background:var(--surface3); }

/* CONTENT */
.content { flex:1; overflow-y:auto; overflow-x:hidden; padding:16px; display:flex; gap:16px; align-items:stretch; }
.content::-webkit-scrollbar { width:4px; }
.content::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
@media (max-width:680px) { .content { flex-direction:column; } }

/* CARDS */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); backdrop-filter:var(--blur); padding:20px; position:relative; overflow:hidden; transition:background .4s,border .4s; }
.card-timer { flex:0 0 290px; min-width:230px; display:flex; flex-direction:column; }
@media (max-width:680px) { .card-timer { flex:none; } }
.card-inbox { flex:1; min-width:0; display:flex; flex-direction:column; }

/* TIMER */
.mode-pills { display:flex; gap:6px; margin-bottom:14px; }
.pill { font-size:11px; font-weight:500; letter-spacing:.8px; text-transform:uppercase; padding:4px 11px; border-radius:20px; border:1px solid var(--border2); cursor:pointer; transition:all .2s; color:var(--text2); background:transparent; }
.pill.af { background:var(--accent); color:#0f0f13; border-color:var(--accent); }
.pill.ab { background:var(--accent2); color:#0f0f13; border-color:var(--accent2); }

.ring-wrap { display:flex; justify-content:center; align-items:center; margin:8px 0 14px; position:relative; }
.ring-svg { transform:rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--border2); stroke-width:6; }
.ring-fg { fill:none; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 1s linear,stroke .5s; }
.ring-time { position:absolute; font-family:var(--font-mono); font-size:34px; font-weight:500; letter-spacing:2px; line-height:1; }
.ring-sub { position:absolute; top:58%; left:50%; transform:translateX(-50%); font-size:10px; color:var(--text3); letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }

.timer-ctrl { display:flex; justify-content:center; gap:10px; margin-bottom:14px; }
.cbtn2 { width:44px; height:44px; border-radius:50%; border:1px solid var(--border2); background:var(--surface2); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.cbtn2.primary { width:52px; height:52px; background:var(--accent); color:#0f0f13; border-color:var(--accent); box-shadow:0 0 22px var(--focus-glow); }
.cbtn2.primary.brk { background:var(--accent2); border-color:var(--accent2); box-shadow:0 0 22px var(--break-glow); }
.cbtn2:hover { background:var(--surface3); }
.cbtn2.primary:hover { opacity:.88; }

.stats-row { display:flex; justify-content:space-between; padding:12px 0 0; border-top:1px solid var(--border); margin-top:auto; }
.stat { text-align:center; }
.sv { font-family:var(--font-mono); font-size:17px; font-weight:500; color:var(--accent); }
.sv.b { color:var(--accent2); } .sv.r { color:var(--accent3); } .sv.o { color:var(--accent4); }
.sl { font-size:9px; color:var(--text3); letter-spacing:1px; text-transform:uppercase; margin-top:2px; }

/* DAILY ROW */
.daily-row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding:10px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); }
.daily-date { font-family:var(--font-mono); font-size:10px; color:var(--text3); }
.daily-date b { color:var(--text2); font-weight:500; }
.auto-badge { font-size:9px; padding:2px 6px; border-radius:6px; background:rgba(255,179,71,.12); color:var(--accent4); border:1px solid rgba(255,179,71,.25); letter-spacing:.5px; }
.reset-btn { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; letter-spacing:.5px; padding:5px 11px; border-radius:8px; border:1px solid rgba(255,107,107,.3); background:rgba(255,107,107,.08); color:var(--accent3); cursor:pointer; transition:all .2s; }
.reset-btn:hover { background:rgba(255,107,107,.2); border-color:var(--accent3); }

/* INBOX */
.inbox-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.inbox-title { font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--text2); }
.inbox-cnt { font-family:var(--font-mono); font-size:11px; color:var(--text3); background:var(--surface2); padding:2px 8px; border-radius:10px; border:1px solid var(--border); }
.inbox-input-wrap { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 13px; margin-bottom:12px; transition:border-color .2s,box-shadow .2s; }
.inbox-input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(200,255,87,.08); }
.inbox-input { flex:1; background:transparent; border:none; outline:none; font-size:13px; color:var(--text); font-family:var(--font-body); }
.inbox-input::placeholder { color:var(--text3); }
.inbox-locked { position:absolute; inset:0; background:rgba(15,15,19,.7); backdrop-filter:blur(4px); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; z-index:10; }
.light .inbox-locked { background:rgba(242,240,235,.75); }
.inbox-list-wrap { flex:1; overflow:hidden; }
.inbox-list { display:flex; flex-direction:column; gap:5px; height:100%; overflow-y:auto; padding-right:2px; }
.inbox-list::-webkit-scrollbar { width:3px; }
.inbox-list::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

.ii { display:flex; align-items:center; gap:9px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px; transition:all .25s; animation:sIn .25s ease; }
@keyframes sIn { from{opacity:0;transform:translateY(-7px)} to{opacity:1;transform:translateY(0)} }
.ii.done { opacity:.4; border-color:transparent; }
.ii.done .it { text-decoration:line-through; }
.ii.pout { animation:pOut .35s ease forwards; }
@keyframes pOut { to{opacity:0;transform:scale(.88) translateX(20px)} }
.icheck { width:19px; height:19px; border-radius:5px; border:1.5px solid var(--border2); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; color:transparent; }
.icheck.ck { background:var(--accent2); border-color:var(--accent2); color:#0f0f13; }
.it { flex:1; font-size:12px; color:var(--text); line-height:1.4; word-break:break-word; }
.itags { display:flex; gap:3px; flex-shrink:0; }
.tag { font-size:9px; padding:2px 6px; border-radius:5px; cursor:pointer; letter-spacing:.5px; border:1px solid transparent; transition:all .15s; font-weight:500; }
.tag.idea   { background:rgba(200,255,87,.12); color:var(--accent);  border-color:rgba(200,255,87,.2); }
.tag.todo   { background:rgba(87,255,200,.12); color:var(--accent2); border-color:rgba(87,255,200,.2); }
.tag.random { background:rgba(255,107,107,.12); color:var(--accent3); border-color:rgba(255,107,107,.2); }
.tag.unset  { background:var(--surface3); color:var(--text3); }
.idel { color:var(--text3); cursor:pointer; background:none; border:none; padding:2px; border-radius:4px; display:flex; align-items:center; transition:color .15s; }
.idel:hover { color:var(--accent3); }

/* HISTORY MODAL */
.mbk { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); z-index:1000; display:flex; align-items:center; justify-content:center; animation:fIn .2s ease; }
@keyframes fIn { from{opacity:0} to{opacity:1} }
.modal { background:var(--bg); border:1px solid var(--border2); border-radius:20px; width:min(580px,95vw); max-height:82vh; display:flex; flex-direction:column; overflow:hidden; animation:sUp .25s ease; }
@keyframes sUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.mhd { display:flex; align-items:center; justify-content:space-between; padding:17px 20px 13px; border-bottom:1px solid var(--border); }
.mtitle { font-size:14px; font-weight:700; letter-spacing:1px; }
.mbody { overflow-y:auto; flex:1; padding:14px 18px; display:flex; flex-direction:column; gap:10px; }
.mbody::-webkit-scrollbar { width:4px; }
.mbody::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
.hday { border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.hdhd { display:flex; align-items:center; justify-content:space-between; padding:9px 13px; background:var(--surface2); cursor:pointer; user-select:none; }
.hddate { font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--text2); }
.hdstats { display:flex; gap:8px; }
.hchip { font-size:10px; padding:2px 7px; border-radius:6px; font-weight:500; }
.hchip.f { background:rgba(200,255,87,.12); color:var(--accent); }
.hchip.b { background:rgba(87,255,200,.12); color:var(--accent2); }
.hchip.i { background:rgba(255,179,71,.12); color:var(--accent4); }
.hitems { padding:9px 13px; display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--border); }
.hirow { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--text2); }
.hirow .tag { font-size:9px; }
.hidone { color:var(--text3); text-decoration:line-through; }
.empty-h { text-align:center; padding:36px 0; color:var(--text3); font-size:13px; line-height:1.8; }

/* CONFIRM */
.cfbk { position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center; }
.cfov { position:absolute; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); }
.cfcard { position:relative; background:var(--bg); border:1px solid var(--border2); border-radius:16px; padding:24px 26px; width:min(340px,90vw); text-align:center; animation:sUp .2s ease; }
.cfico { font-size:30px; margin-bottom:8px; }
.cftit { font-size:14px; font-weight:700; margin-bottom:6px; }
.cfsub { font-size:11px; color:var(--text3); margin-bottom:18px; line-height:1.7; white-space:pre-line; }
.cfbtns { display:flex; gap:10px; justify-content:center; }
.cfb { padding:8px 20px; border-radius:9px; font-size:12px; font-weight:600; cursor:pointer; transition:all .2s; border:1px solid var(--border2); }
.cfb.cancel { background:var(--surface2); color:var(--text2); }
.cfb.cancel:hover { background:var(--surface3); }
.cfb.danger { background:var(--accent3); color:#fff; border-color:var(--accent3); }
.cfb.danger:hover { opacity:.85; }

/* FX */
#confetti-canvas { position:fixed; inset:0; pointer-events:none; z-index:9999; }
.reward-toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--accent); color:#0f0f13; padding:9px 20px; border-radius:40px; font-size:12px; font-weight:600; letter-spacing:.5px; opacity:0; pointer-events:none; z-index:9998; transition:all .4s; white-space:nowrap; }
.reward-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.sparkle { position:fixed; pointer-events:none; z-index:9997; width:38px; height:38px; animation:spPop .5s ease forwards; }
@keyframes spPop { 0%{opacity:1;transform:scale(.5)} 60%{opacity:1;transform:scale(1.4)} 100%{opacity:0;transform:scale(1.8)} }
.shell.compact .content { display:none !important; }
.shell.compact .compact-bar { border-bottom:none; }
.shell.is-focus .card-timer::after { content:''; position:absolute; inset:-1px; border-radius:var(--radius); border:1px solid var(--accent); opacity:.4; animation:gp 2s ease-in-out infinite; pointer-events:none; }
@keyframes gp { 0%,100%{opacity:.2} 50%{opacity:.6} }
.shell.is-break .card-timer { border-color:rgba(87,255,200,.2); }
.flash { animation:fl .6s ease; }
@keyframes fl { 0%{opacity:0;transform:scale(.97)} 60%{opacity:1;transform:scale(1.01)} 100%{transform:scale(1)} }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="reward-toast" class="reward-toast"></div>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const LS = {
  get:(k,fb)=>{ try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch{return fb;} },
  set:(k,v)=>{ try{localStorage.setItem(k,JSON.stringify(v));}catch{} }
};

function todayStr() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtKo(s) {
  if(!s)return'';
  const [y,m,d]=s.split('-');
  const day=new Date(+y,+m-1,+d).getDay();
  return `${y}.${m}.${d} (${'일월화수목금토'[day]})`;
}
function fmt(sec){ return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; }

function launchConfetti(){
  const cv=document.getElementById('confetti-canvas'),ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const p=Array.from({length:130},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,r:Math.random()*7+3,d:Math.random()*80+20,
    color:['#c8ff57','#57ffc8','#ff6b6b','#ffd700','#ff9fff'][Math.floor(Math.random()*5)],
    tilt:Math.random()*10-10,tiltAngle:0,tiltSpeed:Math.random()*.1+.05,vx:Math.random()*2-1,vy:Math.random()*3+2
  }));
  let fr;
  (function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    p.forEach(q=>{
      ctx.beginPath();ctx.fillStyle=q.color;
      ctx.moveTo(q.x+q.tilt+q.r/3,q.y);ctx.lineTo(q.x+q.tilt,q.y+q.tilt+q.r/5);
      ctx.lineTo(q.x+q.r/2+q.tilt,q.y+q.d+q.tilt);ctx.lineTo(q.x+q.tilt,q.y+q.d);
      ctx.fill();q.y+=q.vy;q.x+=q.vx;q.tiltAngle+=q.tiltSpeed;q.tilt=Math.sin(q.tiltAngle)*12;
    });
    if(p.some(q=>q.y<cv.height))fr=requestAnimationFrame(draw);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
  setTimeout(()=>{ctx.clearRect(0,0,cv.width,cv.height);cancelAnimationFrame(fr);},4500);
}
function toast(msg){
  const el=document.getElementById('reward-toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}
function sparkle(x,y){
  const el=document.createElement('div');el.className='sparkle';el.style.cssText=`left:${x-19}px;top:${y-19}px`;
  el.innerHTML=`<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="8" fill="#57ffc8" opacity=".8"/>
    ${[0,45,90,135,180,225,270,315].map(a=>`<line x1="20" y1="20" x2="${20+14*Math.cos(a*Math.PI/180)}" y2="${20+14*Math.sin(a*Math.PI/180)}" stroke="#57ffc8" stroke-width="2" stroke-linecap="round"/>`).join('')}
  </svg>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),600);
}

const FS=25*60,BS=5*60,RR=70,CIRC=2*Math.PI*RR;
const TL=[null,'idea','todo','random'];
const TN={idea:'아이디어',todo:'할일',random:'잡념'};

/* ── HISTORY MODAL ── */
function HistModal({history,onClose}){
  const [open,setOpen]=useState(null);
  const sorted=[...history].sort((a,b)=>b.date.localeCompare(a.date));
  return (
    <div className="mbk" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="mhd">
          <span className="mtitle">📅 일별 기록 ({history.length}일)</span>
          <button className="icon-btn" onClick={onClose}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div className="mbody">
          {sorted.length===0 && <div className="empty-h">📭 아직 기록이 없어요<br/><small style={{fontSize:11}}>하루를 마감하면 여기에 쌓입니다</small></div>}
          {sorted.map(day=>(
            <div className="hday" key={day.date}>
              <div className="hdhd" onClick={()=>setOpen(open===day.date?null:day.date)}>
                <span className="hddate">{fmtKo(day.date)}</span>
                <div className="hdstats">
                  <span className="hchip f">🎯 {day.sessions}회</span>
                  <span className="hchip b">☕ {day.breaks}회</span>
                  <span className="hchip i">📝 {day.items.length}건</span>
                </div>
              </div>
              {open===day.date&&(
                <div className="hitems">
                  {day.items.length===0&&<div style={{fontSize:11,color:'var(--text3)'}}>인박스 항목 없음</div>}
                  {day.items.map((it,i)=>(
                    <div className="hirow" key={i}>
                      <span>{it.done?'✅':'⬜'}</span>
                      {it.tag&&<span className={`tag ${it.tag}`}>{TN[it.tag]}</span>}
                      <span className={it.done?'hidone':''}>{it.text}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── CONFIRM ── */
function Confirm({title,sub,icon,onOk,onNo}){
  return (
    <div className="cfbk">
      <div className="cfov" onClick={onNo}/>
      <div className="cfcard">
        <div className="cfico">{icon||'⚠️'}</div>
        <div className="cftit">{title}</div>
        <div className="cfsub">{sub}</div>
        <div className="cfbtns">
          <button className="cfb cancel" onClick={onNo}>취소</button>
          <button className="cfb danger" onClick={onOk}>초기화</button>
        </div>
      </div>
    </div>
  );
}

/* ── INBOX ITEM ── */
function IItem({item,onToggle,onTag,onDel,disabled}){
  const [pop,setPop]=useState(false);
  const del=()=>{setPop(true);setTimeout(()=>onDel(item.id),330);};
  return (
    <div className={`ii${item.done?' done':''}${pop?' pout':''}`} style={{opacity:disabled?.5:1}}>
      <button className={`icheck${item.done?' ck':''}`} onClick={e=>!disabled&&onToggle(item.id,e)} disabled={disabled}>
        {item.done&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
      </button>
      <span className="it">{item.text}</span>
      <div className="itags">
        <span className={`tag ${item.tag||'unset'}`} onClick={()=>!disabled&&onTag(item.id)}>{item.tag?TN[item.tag]:'태그'}</span>
      </div>
      <button className="idel" onClick={del} disabled={disabled}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  );
}

/* ══ APP ══ */
function App(){
  const [theme,setTheme]   =useState(()=>LS.get('pmd-theme','dark'));
  const [compact,setCompact]=useState(false);
  const [showHist,setShowHist]=useState(false);
  const [confirm,setConfirm]=useState(false);
  const [flash,setFlash]   =useState(false);

  const [mode,setMode]         =useState(()=>LS.get('pmd-mode','focus'));
  const [rem,setRem]           =useState(()=>LS.get('pmd-rem',FS));
  const [running,setRunning]   =useState(false);
  const [sessions,setSessions] =useState(()=>LS.get('pmd-sessions',0));
  const [breaks,setBreaks]     =useState(()=>LS.get('pmd-breaks',0));
  const [items,setItems]       =useState(()=>LS.get('pmd-items',[]));
  const [history,setHistory]   =useState(()=>LS.get('pmd-history',[]));
  const [lastDate,setLastDate] =useState(()=>LS.get('pmd-lastdate',todayStr()));
  const [draft,setDraft]       =useState('');
  const [cdraft,setCdraft]     =useState('');
  const timerRef=useRef(null);

  /* persist */
  useEffect(()=>LS.set('pmd-theme',theme),[theme]);
  useEffect(()=>LS.set('pmd-mode',mode),[mode]);
  useEffect(()=>LS.set('pmd-rem',rem),[rem]);
  useEffect(()=>LS.set('pmd-sessions',sessions),[sessions]);
  useEffect(()=>LS.set('pmd-breaks',breaks),[breaks]);
  useEffect(()=>LS.set('pmd-items',items),[items]);
  useEffect(()=>LS.set('pmd-history',history),[history]);
  useEffect(()=>LS.set('pmd-lastdate',lastDate),[lastDate]);

  /* save snapshot and reset */
  const doReset = useCallback((fromDate, s, b, its) => {
    const rec = { date:fromDate, sessions:s, breaks:b, items:[...its] };
    setHistory(h=>{
      const idx=h.findIndex(x=>x.date===fromDate);
      if(idx>=0){const n=[...h];n[idx]=rec;return n;}
      return [rec,...h];
    });
    setSessions(0);setBreaks(0);setItems([]);
    setMode('focus');setRem(FS);setRunning(false);
    setLastDate(todayStr());
    setFlash(true);setTimeout(()=>setFlash(false),700);
  }, []);

  /* auto-reset: check on mount + every minute */
  const sessRef=useRef(sessions),brkRef=useRef(breaks),itemsRef=useRef(items),lastRef=useRef(lastDate);
  sessRef.current=sessions;brkRef.current=breaks;itemsRef.current=items;lastRef.current=lastDate;

  useEffect(()=>{
    const check=()=>{
      const today=todayStr();
      if(lastRef.current&&lastRef.current!==today){
        doReset(lastRef.current,sessRef.current,brkRef.current,itemsRef.current);
        toast('🌅 새 날! 어제 기록을 저장했어요');
      }
    };
    check();
    const iv=setInterval(check,60000);
    return()=>clearInterval(iv);
  },[]);

  /* tab title */
  useEffect(()=>{
    if(running) document.title=`[${fmt(rem)}] ${mode==='focus'?'집중 중...':'휴식 중...'}`;
    else document.title='PM Focus Dashboard';
  },[rem,running,mode]);

  /* tick */
  useEffect(()=>{
    if(running){
      timerRef.current=setInterval(()=>{
        setRem(p=>{
          if(p<=1){clearInterval(timerRef.current);onEnd();return 0;}
          return p-1;
        });
      },1000);
    } else clearInterval(timerRef.current);
    return()=>clearInterval(timerRef.current);
  },[running,mode]);

  const onEnd=useCallback(()=>{
    setRunning(false);
    if(mode==='focus'){
      setSessions(s=>s+1);launchConfetti();
      setTimeout(()=>toast('🎯 오늘의 PM 역량 +1'),400);
      setMode('break');setRem(BS);
    } else {
      setBreaks(b=>b+1);setMode('focus');setRem(FS);
      toast('💪 집중 시작!');
    }
  },[mode]);

  const sw=m=>{if(m===mode)return;setRunning(false);setMode(m);setRem(m==='focus'?FS:BS);};
  const add=t=>{const x=t.trim();if(!x)return false;setItems(p=>[{id:Date.now(),text:x,tag:null,done:false},...p]);return true;};
  const toggleDone=(id,e)=>{sparkle(e.clientX,e.clientY);setItems(p=>p.map(it=>it.id===id?{...it,done:!it.done}:it));};
  const cycleTag=id=>setItems(p=>p.map(it=>it.id!==id?it:{...it,tag:TL[(TL.indexOf(it.tag)+1)%TL.length]}));
  const delItem=id=>setItems(p=>p.filter(it=>it.id!==id));

  /* manual reset handler */
  const doManual=()=>{
    const today=todayStr();
    doReset(today,sessions,breaks,items);
    setConfirm(false);
    toast('✨ 오늘 기록 저장 후 초기화!');
  };

  const total=mode==='focus'?FS:BS;
  const dashOff=CIRC*(1-rem/total);
  const rc=mode==='focus'?'#c8ff57':'#57ffc8';
  const locked=mode==='focus'&&running;
  const doneN=items.filter(i=>i.done).length;
  const today=todayStr();

  return (
    <div className={`shell ${theme==='light'?'light':''} ${compact?'compact':''} ${running&&mode==='focus'?'is-focus':''} ${running&&mode==='break'?'is-break':''}`}>

      {/* COMPACT BAR */}
      <div className="compact-bar">
        <span style={{fontSize:12,fontWeight:700,color:'var(--text3)',letterSpacing:'1px'}}>PM</span>
        <span className={`compact-timer${mode==='break'?' brk':''}`}>{fmt(rem)}</span>
        <span className="compact-label">{mode==='focus'?'집중':'휴식'}</span>
        <button className="icon-btn" onClick={()=>setRunning(r=>!r)}>
          {running
            ?<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
            :<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>}
        </button>
        <div className="compact-input-wrap">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>
          <input value={cdraft} onChange={e=>setCdraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){if(add(cdraft))setCdraft('');}}} placeholder="잡념 입력 후 Enter..."/>
        </div>
        <span style={{fontSize:10,color:'var(--text3)',minWidth:16,textAlign:'center'}}>{items.length}</span>
        <button className="icon-btn hist" onClick={()=>setShowHist(true)} title="기록">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button className="icon-btn warn" onClick={()=>setConfirm(true)} title="하루 마감">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button className="theme-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}>{theme==='dark'?'☀️':'🌙'}</button>
        <button className="icon-btn" onClick={()=>setCompact(c=>!c)} title="컴팩트">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            {compact
              ?<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
              :<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M21 16v3a2 2 0 0 0-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>}
          </svg>
        </button>
      </div>

      {/* CONTENT */}
      <div className="content">

        {/* TIMER */}
        <div className={`card card-timer${flash?' flash':''}`}>
          <div className="mode-pills">
            <button className={`pill${mode==='focus'?' af':''}`} onClick={()=>sw('focus')}>집중 25′</button>
            <button className={`pill${mode==='break'?' ab':''}`} onClick={()=>sw('break')}>휴식 5′</button>
          </div>
          <div className="ring-wrap">
            <svg className="ring-svg" width="170" height="170" viewBox="0 0 170 170">
              <circle className="ring-bg" cx="85" cy="85" r={RR}/>
              <circle className="ring-fg" cx="85" cy="85" r={RR} stroke={rc} strokeDasharray={CIRC} strokeDashoffset={dashOff}/>
            </svg>
            <div className="ring-time" style={{color:rc}}>{fmt(rem)}</div>
            <div className="ring-sub">{mode==='focus'?'FOCUS':'BREAK'}</div>
          </div>
          <div className="timer-ctrl">
            <button className="cbtn2" onClick={()=>{setRunning(false);setRem(mode==='focus'?FS:BS);}} title="초기화">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button className={`cbtn2 primary${mode==='break'?' brk':''}`} onClick={()=>setRunning(r=>!r)}>
              {running
                ?<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
                :<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>}
            </button>
            <button className="cbtn2" onClick={()=>{setRunning(false);if(mode==='focus'){setMode('break');setRem(BS);}else{setMode('focus');setRem(FS);}}} title="건너뛰기">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 4l10 8-10 8V4zm10 0h4v16h-4V4z"/></svg>
            </button>
          </div>
          <div className="stats-row">
            <div className="stat"><div className="sv">{sessions}</div><div className="sl">집중</div></div>
            <div className="stat"><div className="sv b">{breaks}</div><div className="sl">휴식</div></div>
            <div className="stat"><div className="sv r">{items.length}</div><div className="sl">잡념</div></div>
            <div className="stat"><div className="sv o">{doneN}</div><div className="sl">처리됨</div></div>
          </div>

          {/* DAILY RESET ROW */}
          <div className="daily-row">
            <div>
              <div className="daily-date"><b>{fmtKo(today)}</b></div>
              <div style={{fontSize:9,color:'var(--text3)',marginTop:3}}>
                {history.length>0?`총 ${history.length}일 기록됨`:'첫 번째 날이에요!'}
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:7}}>
              <span className="auto-badge">자동초기화 ON</span>
              <button className="reset-btn" onClick={()=>setConfirm(true)}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                하루 마감
              </button>
            </div>
          </div>
        </div>

        {/* INBOX */}
        <div className="card card-inbox" style={{position:'relative'}}>
          {locked&&(
            <div className="inbox-locked">
              <div style={{fontSize:26}}>🔒</div>
              <div style={{fontSize:13,color:'var(--text2)'}}>집중 시간엔 잠겨요</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>휴식 때 정리하세요</div>
            </div>
          )}
          <div className="inbox-hd">
            <span className="inbox-title">🧠 인박스</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              {doneN>0&&(
                <button className="icon-btn warn" onClick={()=>setItems(p=>p.filter(i=>!i.done))} style={{fontSize:11,gap:4,padding:'3px 8px',border:'1px solid var(--border)',borderRadius:7}}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                  완료 삭제
                </button>
              )}
              <span className="inbox-cnt">{items.length-doneN} / {items.length}</span>
            </div>
          </div>
          <div className="inbox-input-wrap">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>
            <input className="inbox-input" value={draft} onChange={e=>setDraft(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'){if(add(draft))setDraft('');}}}
              placeholder={locked?'집중 중 — 휴식 때 정리하세요':'잡념을 입력하고 Enter...'}/>
          </div>
          <div className="inbox-list-wrap">
            <div className="inbox-list">
              {items.length===0&&(
                <div style={{textAlign:'center',padding:'28px 0',color:'var(--text3)',fontSize:12}}>
                  <div style={{fontSize:26,marginBottom:8}}>🌿</div><div>아직 잡념이 없어요</div>
                  <div style={{fontSize:10,marginTop:4}}>집중하세요!</div>
                </div>
              )}
              {items.map(it=>(
                <IItem key={it.id} item={it} onToggle={toggleDone} onTag={cycleTag} onDel={delItem} disabled={locked}/>
              ))}
            </div>
          </div>
        </div>
      </div>

      {showHist&&<HistModal history={history} onClose={()=>setShowHist(false)}/>}
      {confirm&&(
        <Confirm
          icon="📦"
          title="오늘 하루를 마감할까요?"
          sub={`${fmtKo(today)}의 기록을 저장하고\n집중 횟수와 인박스를 초기화합니다.\n(기록은 이력 탭에 보관됩니다)`}
          onOk={doManual}
          onNo={()=>setConfirm(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
